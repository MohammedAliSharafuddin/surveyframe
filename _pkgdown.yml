url: https://surveyframe.org

template:
  bootstrap: 5
  bootswatch: flatly
  bslib:
    primary: "#0B3A78"
    secondary: "#16B3B1"
    base_font: {google: "Inter"}
    heading_font: {google: "Inter"}
    code_font: {google: "JetBrains Mono"}
  opengraph:
    image:
      src: man/figures/pkgdown-wordmark-tagline.png
      alt: "surveyframe: From research design to reporting"
  includes:
    in_header: |
      <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareSourceCode",
        "name": "surveyframe",
        "description": "Survey instrument workflows for R. Define instruments, design them visually, deploy surveys, check data quality, score scales, run psychometric diagnostics, and generate reproducible reports from one source object.",
        "codeRepository": "https://github.com/MohammedAliSharafuddin/surveyframe",
        "programmingLanguage": "R",
        "license": "https://opensource.org/licenses/MIT",
        "softwareVersion": "0.4.3",
        "downloadUrl": "https://CRAN.R-project.org/package=surveyframe",
        "author": {
          "@type": "Person",
          "name": "Mohammed Ali Sharafuddin",
          "givenName": "Mohammed Ali",
          "familyName": "Sharafuddin",
          "@id": "https://orcid.org/0000-0001-5247-2964"
        }
      }
      </script>

# man/figures/logo.png is picked up automatically by pkgdown.
# Favicons are in pkgdown/favicon/ and picked up by pkgdown >= 2.0.

home:
  title: "surveyframe: plan, run and report survey research, with or without code"
  description: >
    surveyframe takes a survey study from the questionnaire to the APA 7
    report: design the instrument and its analysis plan, collect the answers,
    check them, run the planned analyses and write the report, in
    SurveyStudio or in R.
  links:
    - text: Verify a .sframe file
      href: verify/
    - text: Get started, no code
      href: articles/start.html
    - text: Cite surveyframe
      href: articles/cite.html
    - text: GitHub repository
      href: https://github.com/MohammedAliSharafuddin/surveyframe
    - text: Report a bug
      href: https://github.com/MohammedAliSharafuddin/surveyframe/issues

navbar:
  title: "surveyframe"
  structure:
    left: [studies, start, learn, rusers]
    right: [verify, cite, github]
  components:
    studies:
      text: "Studies"
      menu:
        - text: "Students and thesis supervisors"
          href: articles/studies.html#students
        - text: "University and teaching evaluation"
          href: articles/studies.html#teaching
        - text: "Organisations"
          href: articles/studies.html#organisations
        - text: "Research labs"
          href: articles/studies.html#research-labs
        - text: "All studies"
          href: articles/studies.html
    start:
      text: "Get started"
      href: articles/start.html
    learn:
      text: "Learn"
      menu:
        - text: "Two ways to run a study"
          href: articles/two-ways-to-run-a-study.html
        - text: "Method guides"
          href: articles/guides.html
        - text: "Frequently asked questions"
          href: articles/learn/faq.html
    rusers:
      text: "For R users"
      menu:
        - text: "Reference"
          href: reference/index.html
        - text: "Articles"
          href: articles/index.html
        - text: "Changelog"
          href: news/index.html
    verify:
      text: "Verify a file"
      href: verify/
      aria-label: "Verify a .sframe file's integrity hash"
    cite:
      text: "Cite"
      href: articles/cite.html
    github:
      icon: fa-github
      href: https://github.com/MohammedAliSharafuddin/surveyframe
      aria-label: GitHub

articles:
  - title: "Studies"
    desc: >
      10 complete survey studies to start from, each with its questionnaire,
      a pre-analysis plan ready to preregister, and SurveyStudio screenshots.
      Web only.
    navbar: ~
    contents:
      - articles/studies
      - starts_with("articles/studies/")
  - title: "Method guides"
    desc: >
      How to answer a research question with a survey, 1 guide per question,
      in SurveyStudio and in R. Web only.
    navbar: ~
    contents:
      - articles/guides
      - starts_with("articles/guides/")
  - title: "Get started and learn"
    desc: >
      Install and open a study with no code, the frequently asked questions,
      and how to cite surveyframe. Web only.
    navbar: ~
    contents:
      - articles/start
      - articles/cite
      - starts_with("articles/learn/")
  - title: "Start here"
    desc: >
      The 5 stages of a study, in SurveyStudio or in R, then 25 small surveys,
      each doing one job, with the whole path from the questionnaire to the
      report. Choose the demo that matches the data you have rather than the
      name of a test.
    navbar: ~
    contents:
      - two-ways-to-run-a-study
      - learn-by-example
  - title: "Survey research workflow"
    desc: >
      Read these in order. Start with the worked example, then build the
      instrument, analyse responses, check reliability and validity, generate
      model syntax, and finish with the visual tools.
    navbar: ~
    contents:
      - surveyframe
      - building-survey-instrument
      - deploying-and-collecting
      - analysing-survey-responses
      - scale-reliability-validity
      - efa-cfa-sem-pls-syntax
      - surveybuilder-gui-overview
  - title: "Specialised analyses"
    desc: >
      Read these when a study calls for them. Small-sample inference covers
      studies below the n = 30 threshold, multi-criteria decision analysis
      covers ranking alternatives against criteria that compete, and text
      analysis covers open-ended survey responses.
    navbar: ~
    contents:
      - small-sample
      - mcdm-analysis
      - text-analysis

reference:
  - title: "Start here"
    desc: >
      SurveyStudio opens an instrument and takes it through every stage
      below, with no code. ?surveyframe is the map of the package, and
      sframe_demo("first_survey") is a whole survey to start from.
    contents:
      - surveyframe-package
      - launch_studio

  - title: "Design"
    desc: >
      Make the instrument: its questions, choice sets, scales, branching and
      attention checks, saved as a portable .sframe file. In SurveyBuilder:
      the Build mode. In code: `sframe_instrument()` and the makers listed
      here, then `write_sframe()`.
    contents:
      - launch_builder
      - sframe_instrument
      - sframe_get_study
      - sframe_sampling_methods
      - sframe_item
      - sframe_choice_set
      - sframe_scale
      - sframe_branch
      - sframe_attention_check
      - sframe_conjoint_design
      - write_sframe
      - read_sframe
      - validate_sframe
      - sframe_validation
      - as_sframe

  - title: "Plan"
    desc: >
      Declare the analysis before the data arrive, so the report shows what
      was planned and what was run. In SurveyBuilder: the Plan mode. In
      SurveyStudio: Plan, or the Analyse screen. In code: `sframe_plan(x) <-
      plan`.
    contents:
      - sframe_plan
      - "sframe_plan<-"
      - sframe_sample_size_plan

  - title: "Preview"
    desc: >
      See the survey as a respondent meets it, with nothing collected. In
      SurveyStudio: the Preview screen. In code: `preview_survey()`.
    contents:
      - preview_survey
      - run_survey

  - title: "Collect"
    desc: >
      Send the survey out: a standalone HTML page, optionally saving answers
      to a Google Sheet, or a Shiny module inside your own app. In
      SurveyBuilder: Export survey, with the Google Sheets settings. In code:
      `export_survey()`.
    contents:
      - export_survey
      - export_google_sheet
      - sframe_survey_ui
      - sframe_survey_server

  - title: "Responses"
    desc: >
      Read the answers back against the instrument, check their quality, and
      export them with labels for other software. In SurveyStudio: the
      Responses and Quality screens. In code: `read_responses()`.
    contents:
      - read_responses
      - read_sheet_responses
      - export_responses
      - sframe_quality_results
      - sframe_missing_data_results
      - sframe_outlier_results

  - title: "Analyse"
    desc: >
      Score the scales and run the plan, block by block. In SurveyStudio: the
      Explore, Reliability and Analyse screens. In code:
      `run_analysis_plan()`.
    contents:
      - run_analysis_plan
      - score_scales
      - sframe_descriptives_results
      - sframe_reliability_results
      - sframe_item_results
      - sframe_efa_readiness_results
      - sframe_efa_solution
      - sframe_validity_results
      - sframe_assumption_results
      - sframe_posthoc_results

  - title: "Report"
    desc: >
      Write up what was run: an HTML, PDF, Word or OpenDocument report or its
      Quarto source, a codebook, the figures,
      and the R code behind each result, and `sframe_show()` to open a
      written file. In SurveyStudio: the Report screen.
      In code: `render_report()`.
    contents:
      - render_report
      - sframe_report_source
      - render_results
      - sframe_reports
      - sframe_format_result
      - sframe_codebook
      - sframe_save_figures
      - sframe_analysis_qmd
      - sframe_show

  - title: "References"
    desc: >
      Cite the works an instrument draws on. The references travel in the
      .sframe file and the report lists each one once, at the end. In
      SurveyStudio: the References screen. In code:
      `sframe_add_references()`.
    contents:
      - sframe_reference
      - read_bibtex
      - sframe_add_references
      - sframe_get_references
      - sframe_bibliography

  - title: "Amendments"
    desc: >
      Change an instrument mid-study, on the record: each amendment is logged
      with its reason and the hash it replaced. In SurveyStudio: the
      Amendments screen. In code: `amend_sframe()`.
    contents:
      - amend_sframe
      - sframe_get_amendments
      - sframe_drop_items
      - sframe_item_flags
      - sframe_link_git_commit

  - title: "Inspect"
    desc: >
      Read parts of an instrument, a validation result or a report without
      reaching into the object, at any stage. Each accessor and as.data.frame
      method states the classes it accepts and what it returns.
    contents:
      - sframe_accessors
      - sframe_apa
      - sframe_get_branches
      - sframe_get_attention_checks
      - sframe_get_choice_sets
      - sf_component_list
      - sframe_flagged
      - sframe_id
      - sframe_identity
      - sframe_is_valid
      - sframe_get_items
      - sframe_label
      - sframe_meta
      - sframe_missing_columns
      - sframe_get_models
      - sframe_object
      - sframe_problems
      - sframe_notes
      - sframe_report_accessors
      - sframe_get_scales
      - sframe_validation_accessors
      - sframe_as_data_frame
      - sframe_subset
      - as.data.frame.sf_choices
      - as.data.frame.sframe
      - as.data.frame.sframe_analysis_results
      - as.data.frame.sframe_assumption_report
      - as.data.frame.sframe_codebook
      - as.data.frame.sframe_descriptives_report
      - as.data.frame.sframe_efa_report
      - as.data.frame.sframe_efa_solution
      - as.data.frame.sframe_item_report
      - as.data.frame.sframe_missing_data_report
      - as.data.frame.sframe_quality_report
      - as.data.frame.sframe_reliability_report
      - as.data.frame.sframe_sample_size_plan
      - as.data.frame.sframe_sensitivity
      - as.data.frame.sframe_validation
      - as.data.frame.sframe_validity_report

  - title: "Models and syntax"
    desc: >
      Declare constructs, paths and covariances, and generate lavaan, seminr
      and psych syntax from the instrument.
    contents:
      - sframe_model_spec
      - sframe_construct
      - sframe_path
      - sframe_covariance
      - sframe_indirect_effect
      - sframe_add_model
      - sframe_validate_model
      - sframe_model_json
      - sframe_model_outline
      - sframe_syntax_cfa
      - sframe_syntax_efa
      - sframe_syntax_sem
      - sframe_syntax_pls
      - sframe_syntax_result

  - title: "Charts"
    desc: >
      Opt-in ggplot2 charts for analysis results, and the package theme.
    contents:
      - sframe_plots
      - theme_surveyframe
      - plot.sframe_analysis_results
      - sframe_plot_correlation_matrix
      - sframe_plot_decision_ranking
      - sframe_plot_dematel_influence
      - sframe_plot_descriptives
      - sframe_plot_efa_loadings
      - sframe_plot_efa_scree
      - sframe_plot_group_comparison
      - sframe_plot_likert_matrix
      - sframe_plot_likert_scale
      - sframe_plot_missingness
      - sframe_plot_paired_comparison
      - sframe_plot_quality
      - sframe_plot_regression_diagnostics
      - sframe_plot_reliability
      - sframe_plot_validity
      - sframe_plot_variable_distribution
      - sframe_plot_term_frequency
      - sframe_plot_ngram_frequency
      - sframe_plot_cooccurrence
      - sframe_plot_cooccurrence_network
      - sframe_plot_sentiment
      - sframe_plot_topics

  - title: "Decision analysis"
    desc: >
      Multi-criteria decision analysis. The 10 methods run through the
      analysis plan like any other, so the functions here assemble their
      input and test how stable a ranking is.
    contents:
      - sframe_sensitivity_analysis
      - sframe_assemble_pairwise
      - sframe_aggregate_judgements
      - sframe_collected_weights
      - sframe_rated_matrix
      - sframe_decision_options
      - sframe_dematel_compute

  - title: "Text analysis"
    desc: >
      Open-ended answers: term and n-gram frequency, keyword in context, and
      quote extraction.
    contents:
      - sframe_clean_text
      - sframe_term_frequency
      - sframe_ngram_frequency
      - sframe_term_context
      - sframe_extract_quotes

  - title: "Confidence intervals"
    desc: >
      Base-R bootstrap and effect-size confidence intervals, reused across
      the inferential runners.
    contents:
      - sframe_bootstrap_ci
      - sframe_cohens_d_ci
      - sframe_cramers_v_ci
      - sframe_eta_sq_ci

  - title: "Demos"
    desc: >
      25 small teaching demos, each doing one job, and 2 larger reference
      datasets. Each comes with an instrument and response data, and the
      teaching demos with a codebook and the results surveyframe produced.
      See the "Learn by example" article.
    contents:
      - sframe_list_demos
      - sframe_demo
      - sframe_demo_qmd

  - title: "Methods"
    desc: >
      Print, format and summary methods, so every component prints and
      summarises cleanly at the console and inside reports.
    contents:
      - print.sframe
      - format.sframe
      - summary.sframe
      - print.sf_choices
      - format.sf_choices
      - summary.sf_choices
      - print.sf_item
      - format.sf_item
      - summary.sf_item
      - print.sf_scale
      - format.sf_scale
      - summary.sf_scale
      - print.sf_branch
      - format.sf_branch
      - summary.sf_branch
      - print.sf_check
      - format.sf_check
      - summary.sf_check
      - print.sf_model
      - format.sf_model
      - summary.sf_model

  - title: "For the report template"
    desc: >
      The APA cell formatter the Quarto report template calls. Exported
      because Quarto renders against the installed package.
    contents:
      - sframe_apa_cells

  - title: "Old names (superseded)"
    desc: >
      Every name changed in 0.4.3, each still working, and what replaced it.
    contents:
      - superseded

footer:
  structure:
    left: [developed_by, built_with]
    right: [package]
  components:
    package: >
      surveyframe is an open-source R package for survey research.
      MIT License.
