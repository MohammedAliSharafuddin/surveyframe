url: https://mohammedalisharafuddin.github.io/surveyframe

template:
  bootstrap: 5
  bootswatch: flatly
  bslib:
    primary: "#0B3A78"
    secondary: "#16B3B1"
    base_font: {google: "Inter"}
    heading_font: {google: "Inter"}
    code_font: {google: "JetBrains Mono"}
  opengraph:
    image:
      src: man/figures/pkgdown-wordmark-tagline.png
      alt: "surveyframe: From research design to reporting"
  includes:
    in_header: |
      <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareSourceCode",
        "name": "surveyframe",
        "description": "Survey instrument workflows for R. Define instruments, design them visually, deploy surveys, check data quality, score scales, run psychometric diagnostics, and generate reproducible reports from one source object.",
        "codeRepository": "https://github.com/MohammedAliSharafuddin/surveyframe",
        "programmingLanguage": "R",
        "license": "https://opensource.org/licenses/MIT",
        "softwareVersion": "0.4.3",
        "downloadUrl": "https://CRAN.R-project.org/package=surveyframe",
        "author": {
          "@type": "Person",
          "name": "Mohammed Ali Sharafuddin",
          "givenName": "Mohammed Ali",
          "familyName": "Sharafuddin",
          "@id": "https://orcid.org/0000-0001-5247-2964"
        }
      }
      </script>

# man/figures/logo.png is picked up automatically by pkgdown.
# Favicons are in pkgdown/favicon/ and picked up by pkgdown >= 2.0.

home:
  title: "Proactive Survey Research Workflows for R"
  description: >
    Survey instrument workflows for R.
    Define instruments, design them visually, deploy surveys,
    check data quality, score scales, run psychometric diagnostics,
    and generate reproducible reports from one source object.
  links:
    - text: Verify a .sframe file
      href: verify/
    - text: SurveyBuilder
      href: reference/launch_builder.html
    - text: SurveyStudio interface
      href: articles/surveyframe.html
    - text: GitHub repository
      href: https://github.com/MohammedAliSharafuddin/surveyframe
    - text: Report a bug
      href: https://github.com/MohammedAliSharafuddin/surveyframe/issues

navbar:
  title: "surveyframe"
  left:
    - text: "Get started"
      href: articles/surveyframe.html
    - text: "Reference"
      href: reference/index.html
    - text: "Changelog"
      href: news/index.html
  right:
    - text: "Verify a file"
      href: verify/
      aria-label: "Verify a .sframe file's integrity hash"
    - icon: fa-github
      href: https://github.com/MohammedAliSharafuddin/surveyframe
      aria-label: GitHub

articles:
  - title: "Start here"
    desc: >
      Twenty-two small surveys, each doing one job, with the whole path from
      the questionnaire to the report. Choose the demo that matches the data
      you have rather than the name of a test.
    navbar: ~
    contents:
      - learn-by-example
  - title: "Survey research workflow"
    desc: >
      Read these in order. Start with the worked example, then build the
      instrument, analyse responses, check reliability and validity, generate
      model syntax, and finish with the visual tools.
    navbar: ~
    contents:
      - surveyframe
      - building-survey-instrument
      - deploying-and-collecting
      - analysing-survey-responses
      - scale-reliability-validity
      - efa-cfa-sem-pls-syntax
      - surveybuilder-gui-overview
  - title: "Specialised analyses"
    desc: >
      Read these when a study calls for them. Small-sample inference covers
      studies below the n = 30 threshold, multi-criteria decision analysis
      covers ranking alternatives against criteria that compete, and text
      analysis covers open-ended survey responses.
    navbar: ~
    contents:
      - small-sample
      - mcdm-analysis
      - text-analysis

reference:
  - title: "Demo library"
    desc: >
      Twenty-two small demos, each doing one job, with an instrument,
      response data, a codebook of variable and value labels, and the
      results surveyframe produced. Load one, change it, and keep going.
      See the "Learn by example" article.
    contents:
      - sframe_list_demos
      - sframe_demo
      - sframe_demo_branding
      - sframe_demo_qmd
      - preview_demo
      - export_responses

  - title: "Design"
    desc: >
      Start visually in the HTML SurveyBuilder or construct instruments in R.
    contents:
      - launch_builder
      - launch_builder_demo
      - launch_studio_demo
      - launch_dashboard_demo

  - title: "Build an instrument"
    desc: >
      Constructor functions for building the sframe instrument object.
      Start here.
    contents:
      - sframe_instrument
      - sframe_item
      - sframe_choice_set
      - sframe_scale
      - sframe_branch
      - sframe_attention_check
      - sframe_model_spec
      - sframe_construct
      - sframe_path
      - sframe_covariance
      - sframe_indirect_effect
      - sframe_add_model

  - title: "Save and load"
    desc: >
      Read and write instruments as portable .sframe JSON files with
      SHA-256 integrity hashing, and record disclosed revisions to them.
    contents:
      - write_sframe
      - read_sframe
      - validate_sframe
      - sframe_validate_model
      - sframe_model_json
      - amend_sframe
      - sframe_get_amendments
      - sframe_link_git_commit
      - sframe_validation

  - title: "Accessors and coercion"
    desc: >
      Read parts of an instrument, a validation result, or a report
      without reaching into the object directly, new in 0.4.0. Each
      accessor and as.data.frame method has its own page as of 0.4.2,
      stating the classes it accepts and what it returns.
    contents:
      - as_sframe
      - sframe_accessors
      - sframe_apa
      - sframe_get_branches
      - sframe_get_attention_checks
      - sframe_get_choice_sets
      - sf_component_list
      - sframe_flagged
      - sframe_id
      - sframe_identity
      - sframe_is_valid
      - sframe_get_items
      - sframe_label
      - sframe_meta
      - sframe_missing_columns
      - sframe_get_models
      - sframe_object
      - sframe_plan
      - "sframe_plan<-"
      - sframe_problems
      - sframe_report_accessors
      - sframe_get_scales
      - sframe_validation_accessors
      - sframe_as_data_frame
      - sframe_subset
      - as.data.frame.sf_choices
      - as.data.frame.sframe
      - as.data.frame.sframe_analysis_results
      - as.data.frame.sframe_assumption_report
      - as.data.frame.sframe_codebook
      - as.data.frame.sframe_descriptives_report
      - as.data.frame.sframe_efa_report
      - as.data.frame.sframe_efa_solution
      - as.data.frame.sframe_item_report
      - as.data.frame.sframe_missing_data_report
      - as.data.frame.sframe_quality_report
      - as.data.frame.sframe_reliability_report
      - as.data.frame.sframe_sample_size_plan
      - as.data.frame.sframe_sensitivity
      - as.data.frame.sframe_validation
      - as.data.frame.sframe_validity_report

  - title: "Deploy"
    desc: >
      Render the instrument as a Shiny survey or launch SurveyStudio.
    contents:
      - run_survey
      - export_survey
      - launch_studio
      - launch_dashboard
      - sframe_survey_ui
      - sframe_survey_server

  - title: "Collect responses"
    desc: >
      Load and validate response data against the instrument specification.
    contents:
      - read_responses
      - export_google_sheet
      - read_sheet_responses

  - title: "Quality checks"
    desc: >
      Evaluate response data for attention check failures, straight-lining,
      missingness, and duplicate submissions.
    contents:
      - sframe_quality_results
      - sframe_missing_data_results
      - sframe_outlier_results
      - sframe_assumption_results

  - title: "Score and analyse"
    desc: >
      Score composite scales, compute reliability statistics, and prepare
      psychometric diagnostics and pre-planned analyses.
    contents:
      - score_scales
      - sframe_descriptives_results
      - sframe_reliability_results
      - sframe_item_results
      - sframe_efa_readiness_results
      - sframe_efa_solution
      - sframe_validity_results
      - sframe_syntax_cfa
      - sframe_syntax_efa
      - sframe_syntax_sem
      - sframe_syntax_pls
      - sframe_posthoc_results
      - sframe_sample_size_plan
      - run_analysis_plan

  - title: "Decision analysis"
    desc: >
      Multi-criteria decision analysis, new in 0.4.0. The 10 methods run
      through the analysis plan like any other, so the functions here are the
      ones that assemble their input, test how stable a ranking is, and build
      choice designs.
    contents:
      - sframe_sensitivity_analysis
      - sframe_conjoint_design
      - sframe_assemble_pairwise
      - sframe_aggregate_judgements
      - sframe_collected_weights
      - sframe_rated_matrix
      - sframe_decision_options
      - sframe_dematel_compute

  - title: "Text analysis"
    desc: >
      Structured analysis of open-ended text responses, new in 0.5.0: term
      and n-gram frequency, keyword-in-context concordance, co-occurrence
      (plain and network), sentiment, topic modelling, and quote extraction.
    contents:
      - sframe_clean_text
      - sframe_term_frequency
      - sframe_ngram_frequency
      - sframe_term_context
      - sframe_extract_quotes

  - title: "Confidence intervals"
    desc: >
      Base-R bootstrap and effect-size confidence interval helpers, reused
      across the inferential runners.
    contents:
      - sframe_bootstrap_ci
      - sframe_cohens_d_ci
      - sframe_cramers_v_ci
      - sframe_eta_sq_ci

  - title: "Report"
    desc: >
      Generate codebooks, scale appendices, reproducible HTML reports, and
      the R code behind a computed result.
    contents:
      - sframe_reports
      - sframe_codebook
      - sframe_codebook_items_display
      - render_report
      - render_results
      - sframe_format_result
      - sframe_model_outline
      - sframe_syntax_result
      - sframe_result_supplement
      - sframe_analysis_qmd
      - sframe_save_figures

  - title: "References"
    desc: >
      Cite the works an instrument draws on. The references travel in the
      .sframe file and the report lists each one once, at the end.
    contents:
      - sframe_reference
      - read_bibtex
      - sframe_add_references
      - sframe_get_references
      - sframe_bibliography

  - title: "Plotting"
    desc: >
      Opt-in ggplot2 charts for analysis results, and the package theme.
    contents:
      - sframe_plots
      - theme_surveyframe
      - plot.sframe_analysis_results
      - sframe_plot_correlation_matrix
      - sframe_plot_decision_ranking
      - sframe_plot_dematel_influence
      - sframe_plot_descriptives
      - sframe_plot_efa_loadings
      - sframe_plot_efa_scree
      - sframe_plot_group_comparison
      - sframe_plot_likert_matrix
      - sframe_plot_likert_scale
      - sframe_plot_missingness
      - sframe_plot_paired_comparison
      - sframe_plot_quality
      - sframe_plot_regression_diagnostics
      - sframe_plot_reliability
      - sframe_plot_validity
      - sframe_plot_variable_distribution
      - sframe_draw_mosaic
      - sframe_likert_scale_groups
      - sframe_plot_term_frequency
      - sframe_plot_ngram_frequency
      - sframe_plot_cooccurrence
      - sframe_plot_cooccurrence_network
      - sframe_plot_sentiment
      - sframe_plot_topics

  - title: "Print, format, and summary methods"
    desc: >
      S3 methods so every component object prints and summarises cleanly at
      the console and inside reports.
    contents:
      - print.sframe
      - format.sframe
      - summary.sframe
      - print.sf_choices
      - format.sf_choices
      - summary.sf_choices
      - print.sf_item
      - format.sf_item
      - summary.sf_item
      - print.sf_scale
      - format.sf_scale
      - summary.sf_scale
      - print.sf_branch
      - format.sf_branch
      - summary.sf_branch
      - print.sf_check
      - format.sf_check
      - summary.sf_check
      - print.sf_model
      - format.sf_model
      - summary.sf_model

  - title: "Old names (superseded)"
    contents:
      - superseded

  - title: "Package"
    contents:
      - surveyframe-package
      - sframe_demo_data
      - sframe_input_types_demo_data
      - sframe_builder_empty_state
      - sframe_builder_state_from_instrument
      - sframe_builder_validate_draft

footer:
  structure:
    left: [developed_by, built_with]
    right: [package]
  components:
    package: >
      surveyframe is an open-source R package for survey research.
      MIT License.
