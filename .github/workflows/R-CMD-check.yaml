name: R CMD check

on:
  push:
    branches: [main, master, dev, 'fix/**']
  pull_request:
    branches: [main, master, dev]

jobs:
  R-CMD-check:
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          # Browser tests run on Ubuntu release alone (owner, 2026-11-05).
          - { os: ubuntu-latest,  r: "release", browser: "true"  }
          - { os: ubuntu-latest,  r: "devel",   browser: "false" }
          - { os: windows-latest, r: "release", browser: "false" }
          - { os: macos-latest,   r: "release", browser: "false" }

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      SURVEYFRAME_CI_BROWSER: ${{ matrix.config.browser }}

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--compact-vignettes=gs+qpdf")'
