name: R CMD check

on:
  push:
    branches: [main, master, dev, 'fix/**']
  pull_request:
    branches: [main, master, dev]

jobs:
  R-CMD-check:
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest,  r: "release" }
          - { os: ubuntu-latest,  r: "devel"   }
          - { os: windows-latest, r: "release" }
          - { os: macos-latest,   r: "release" }

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # macOS only, never fails the job: the Typst PDF tests found no figure
      # there (run 41973734890) after knitr raised 28 warnings that Linux
      # does not. This prints them, the graphics capabilities, and whether
      # the SVG figure exists, from a temp folder under /var as the tests use.
      - name: Diagnose Typst figures (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        run: |
          d=$(mktemp -d)
          cd "$d"
          printf '%s\n' '---' 'format: typst' '---' '```{r}' 'options(warn = 1)' \
            'print(capabilities()[c("cairo", "png", "aqua")])' 'print(getwd())' \
            'plot(1:10)' 'library(ggplot2)' 'print(ggplot(data.frame(x = 1:10), aes(x, x)) + geom_point())' '```' > t.qmd
          quarto render t.qmd --to typst -M keep-typ:true 2>&1 | tail -40 || true
          pwd -P
          find . -name '*.svg' -o -name '*.png'
          Rscript -e 'print(capabilities("cairo"))' \
            -e 'r <- tryCatch(withCallingHandlers({ svg(tempfile(fileext = ".svg")); plot(1); dev.off(); "svg() ran" }, warning = function(w) { message("svg() warning: ", conditionMessage(w)); invokeRestart("muffleWarning") }), error = function(e) paste("svg() error:", conditionMessage(e))); print(r)' \
            -e 'print(requireNamespace("svglite", quietly = TRUE))' \
            -e 'print(.libPaths()); print(Sys.which("Rscript"))'

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--compact-vignettes=gs+qpdf")'
